apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: semosan
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SEMOSAN/SEMOSAN_BE
    targetRevision: develop
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: semosan
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true