plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com.semosan'
version = '0.0.1-SNAPSHOT'

jacoco {
	toolVersion = '0.8.12'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// WebClient (카카오 API 호출)
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	// Boot 4부터 WebClientAutoConfiguration(WebClient.Builder 빈)이 starter-webflux와 분리된 별도 모듈로 이동
	implementation 'org.springframework.boot:spring-boot-webclient'

	// Swagger
	implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0")

	// MinIO
	implementation 'io.minio:minio:8.5.17'

	// JWT 라이브러리 (jjwt)
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'

	// FCM
	implementation 'com.google.firebase:firebase-admin:9.8.0'

	// Redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// PostGIS (Hibernate Spatial + JTS)
	implementation 'org.hibernate.orm:hibernate-spatial'

	// WebSocket (트래킹 GPS 실시간 수집 — STOMP)
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	// Flyway
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// Actuator + Prometheus
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	// JSON 로깅 (Loki 연동)
	implementation 'net.logstash.logback:logstash-logback-encoder:8.0'

}

jar { enabled = false }

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

jacocoTestCoverageVerification {
	dependsOn jacocoTestReport
	violationRules {
		rule {
			limit {
				minimum = 0.90
			}
		}
	}
}

check.dependsOn jacocoTestCoverageVerification
