# argocd-notifications-secret 템플릿 — 실제 웹훅 URL은 절대 이 레포에 커밋하지 않는다.
# 서버에서 discord-webhook-url 값을 실제 웹훅 URL로 채운 뒤 kubectl apply -f 로 직접 적용한다.
apiVersion: v1
kind: Secret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
  labels:
    app.kubernetes.io/component: notifications-controller
    app.kubernetes.io/name: argocd-notifications-controller
    app.kubernetes.io/part-of: argocd
type: Opaque
stringData:
  discord-webhook-url: "https://discord.com/api/webhooks/<여기에-실제-웹훅-경로>"
