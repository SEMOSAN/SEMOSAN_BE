# ArgoCD Notifications — discord 알림 서비스/트리거/템플릿 정의.
#
# 이 파일은 참고/재현용이며 `k8s/kustomization.yaml`에는 포함하지 않는다.
# semosan Application은 destination.namespace=semosan 이라 argocd 네임스페이스
# 리소스를 GitOps로 동기화하기 부적절하고(AppProject 데스티네이션 제약 우려),
# argocd-notifications-cm/-secret은 애초에 kubectl apply로 수동 생성된 리소스라
# 같은 방식으로 서버에서 직접 적용한다. 적용 명령은 #326 이슈/PR 참고.
#
# 실제 discord 웹훅 URL은 이 파일에 없다 — argocd-notifications-secret의
# discord-webhook-url 키를 $discord-webhook-url 로 참조한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
  labels:
    app.kubernetes.io/component: notifications-controller
    app.kubernetes.io/name: argocd-notifications-controller
    app.kubernetes.io/part-of: argocd
data:
  service.webhook.discord: |
    url: $discord-webhook-url
    headers:
    - name: Content-Type
      value: application/json

  template.app-sync-failed: |
    webhook:
      discord:
        method: POST
        body: |
          {
            "content": "🔴 **[{{.app.metadata.name}}] 배포 Sync 실패**\n{{.app.status.operationState.message}}"
          }

  template.app-health-degraded: |
    webhook:
      discord:
        method: POST
        body: |
          {
            "content": "🟠 **[{{.app.metadata.name}}] Health Degraded**\nstatus: {{.app.status.health.status}}"
          }

  trigger.on-sync-failed: |
    - when: app.status.operationState.phase in ['Error', 'Failed']
      send: [app-sync-failed]

  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      send: [app-health-degraded]
