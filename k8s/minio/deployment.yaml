apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: semosan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
          # 고정 태그이므로 노드에 받아둔 이미지를 재사용한다.
          # Always 로 두면 레지스트리 장애 시 파드가 재기동되지 못한다.
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - containerPort: 9000
            - containerPort: 9001
          envFrom:
            - secretRef:
                name: minio-secret
          volumeMounts:
            - name: minio-data
              mountPath: /data
      nodeSelector:
        kubernetes.io/hostname: k8s-master
      volumes:
        - name: minio-data
          hostPath:
            path: /data/minio
            type: DirectoryOrCreate
