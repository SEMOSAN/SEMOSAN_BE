apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: semosan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          # MinIO 공식 이미지가 quay.io/Docker Hub에서 모두 내려가서(2026-10 기준 둘 다 pull 불가)
          # Bitnami 레거시 아카이브 이미지를 사용한다 — upstream minio 바이너리 포함, 더 이상 업데이트되지 않는 동결 이미지.
          image: docker.io/bitnamilegacy/minio:latest
          imagePullPolicy: IfNotPresent
          # bitnami 초기화 스크립트(/bitnami/minio/data 경로 강제)를 우회하고
          # 기존과 동일하게 /data 를 데이터 디렉토리로 사용하기 위해 entrypoint 를 직접 지정한다.
          command:
            - minio
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          # bitnami 이미지는 기본 uid 1001(non-root)인데 hostPath(/data/minio)는 root 소유라 권한 문제가 생긴다.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          ports:
            - containerPort: 9000
            - containerPort: 9001
          envFrom:
            - secretRef:
                name: minio-secret
          volumeMounts:
            - name: minio-data
              mountPath: /data
      nodeSelector:
        kubernetes.io/hostname: k8s-master
      volumes:
        - name: minio-data
          hostPath:
            path: /data/minio
            type: DirectoryOrCreate
