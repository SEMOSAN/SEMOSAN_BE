apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: semosan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        # hostPath 볼륨은 fsGroup 이 적용되지 않아서 데이터 디렉토리 소유권을 직접 맞춘다.
        - name: init-data-permission
          image: ghcr.io/semosan/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
          imagePullPolicy: IfNotPresent
          command:
            - chown
            - -R
            - "1001:1001"
            - /data
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: minio-data
              mountPath: /data
      containers:
        - name: minio
          # MinIO 공식 이미지가 quay.io/Docker Hub에서 모두 내려가서(2026-10 기준 둘 다 pull 불가)
          # Bitnami 레거시 아카이브를 GHCR 로 미러링해 다이제스트로 고정했다.
          image: ghcr.io/semosan/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
          imagePullPolicy: IfNotPresent
          # bitnami 초기화 스크립트(/bitnami/minio/data 경로 강제)를 우회하고
          # 기존과 동일하게 /data 를 데이터 디렉토리로 사용하기 위해 entrypoint 를 직접 지정한다.
          command:
            - minio
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 9000
            - containerPort: 9001
          envFrom:
            - secretRef:
                name: minio-secret
          volumeMounts:
            - name: minio-data
              mountPath: /data
      nodeSelector:
        kubernetes.io/hostname: k8s-master
      volumes:
        - name: minio-data
          hostPath:
            path: /data/minio
            type: DirectoryOrCreate
