apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: semosan-api-ingress
  namespace: semosan
spec:
  podSelector:
    matchLabels:
      app: semosan-api
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
