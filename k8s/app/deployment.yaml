apiVersion: apps/v1
kind: Deployment
metadata:
  name: semosan-api
  namespace: semosan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: semosan-api
  template:
    metadata:
      labels:
        app: semosan-api
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: semosan-api
          image: ghcr.io/semosan/semosan_be:4ecdd51661b50db49ad8bf33d7a3951ae3475a00
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: app-secret
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30