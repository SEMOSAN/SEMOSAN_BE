spring:
  application:
    name: api

  profiles:
    default: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  client-secret: ${KAKAO_CLIENT_SECRET}
  admin-key: ${KAKAO_ADMIN_KEY}

tracking:
  stream-key: ${TRACKING_STREAM_KEY}
  consumer-group: ${TRACKING_CONSUMER_GROUP}
  stream-max-len: ${TRACKING_STREAM_MAX_LEN:100000}

test:
  secret-key: ${TEST_SECRET_KEY}

firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  default-flat-param-object: true
  use-enum-ref: true

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  public-url: ${MINIO_PUBLIC_URL}

demo:
  photo-filenames: ${DEMO_PHOTO_FILENAMES}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never
  server:
    port: 9090
  prometheus:
    metrics:
      export:
        enabled: true

weather:
  api-key: ${WEATHER_API_KEY}

discord:
  alert:
    enabled: ${DISCORD_ALERT_ENABLED}
    webhook-url: ${DISCORD_WEBHOOK_URL}
    report-webhook-url: ${DISCORD_REPORT_WEBHOOK_URL}
